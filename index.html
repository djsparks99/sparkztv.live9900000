        <!-- Glass Shatter canvas component -->
        <canvas id="shatter-canvas"></canvas>

        <script>
            (function() {
                const preloaderStartTime = Date.now();
                const MIN_DURATION = 4000; // 4 seconds minimum display duration
                let shattered = false;

                function startShatter() {
                    if (shattered) return;
                    shattered = true;

                    const overlay = document.getElementById('preloader-overlay');
                    const canvas = document.getElementById('shatter-canvas');
                    if (!overlay || !canvas) return;

                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        overlay.parentNode.removeChild(overlay);
                        return;
                    }

                    const dpr = window.devicePixelRatio || 1;
                    const width = window.innerWidth;
                    const height = window.innerHeight;

                    canvas.width = width * dpr;
                    canvas.height = height * dpr;
                    canvas.style.width = width + 'px';
                    canvas.style.height = height + 'px';
                    ctx.scale(dpr, dpr);

                    // Create offscreen canvas representing static snapshots
                    const offscreen = document.createElement('canvas');
                    offscreen.width = width * dpr;
                    offscreen.height = height * dpr;
                    const octx = offscreen.getContext('2d');
                    octx.scale(dpr, dpr);

                    // Draw beautiful preloader representation to offscreen canvas
                    octx.fillStyle = '#000000';
                    octx.fillRect(0, 0, width, height);

                    // Draw glowing ring
                    octx.save();
                    octx.translate(width / 2, height / 2 - 40);
                    octx.shadowColor = '#ccff00';
                    octx.shadowBlur = 25;
                    octx.strokeStyle = '#ccff00';
                    octx.lineWidth = 3;
                    octx.beginPath();
                    octx.arc(0, 0, 70, 0, 2 * Math.PI);
                    octx.stroke();
                    octx.restore();

                    // Draw yellow speech bubble with cute eyes on canvas
                    octx.save();
                    octx.translate(width / 2, height / 2 - 40);
                    
                    octx.shadowColor = '#dbfc01';
                    octx.shadowBlur = 12;
                    octx.strokeStyle = '#111524';
                    octx.lineWidth = 4;
                    octx.fillStyle = '#dbfc01';
                    octx.lineJoin = 'round';
                    octx.lineCap = 'round';
                    
                    // Speech bubble body path
                    octx.beginPath();
                    if (octx.roundRect) {
                        octx.roundRect(-30, -30, 60, 60, 10);
                    } else {
                        octx.rect(-30, -30, 60, 60);
                    }
                    octx.fill();
                    octx.stroke();

                    // The talk tail
                    octx.beginPath();
                    octx.moveTo(-18, 25);
                    octx.lineTo(-28, 36);
                    octx.lineTo(-6, 28);
                    octx.closePath();
                    octx.fillStyle = '#dbfc01';
                    octx.fill();
                    octx.stroke();

                    // Draw eyes
                    octx.fillStyle = '#111524';
                    octx.shadowBlur = 0; // Turn off shadow blur for eyes for crisp look
                    
                    // Left eye
                    octx.beginPath();
                    octx.arc(-11, 4, 6.5, 0, Math.PI * 2);
                    octx.fill();
                    // Left eye glints
                    octx.fillStyle = '#ffffff';
                    octx.beginPath();
                    octx.arc(-12.5, 1.5, 2, 0, Math.PI * 2);
                    octx.fill();
                    octx.beginPath();
                    octx.arc(-9, 6, 0.9, 0, Math.PI * 2);
                    octx.fill();

                    // Right eye
                    octx.fillStyle = '#111524';
                    octx.beginPath();
                    octx.arc(11, 4, 6.5, 0, Math.PI * 2);
                    octx.fill();
                    // Right eye glints
                    octx.fillStyle = '#ffffff';
                    octx.beginPath();
                    octx.arc(9.5, 1.5, 2, 0, Math.PI * 2);
                    octx.fill();
                    octx.beginPath();
                    octx.arc(13, 6, 0.9, 0, Math.PI * 2);
                    octx.fill();

                    // Text under the logo
                    octx.fillStyle = '#ccff00';
                    octx.shadowColor = '#ccff00';
                    octx.shadowBlur = 10;
                    octx.font = '900 11px "Inter", system-ui, sans-serif';
                    octx.textAlign = 'center';
                    octx.fillText('SPARKZ', 0, 48);
                    octx.restore();

                    // Draw audio equalizer bars
                    octx.save();
                    octx.translate(width / 2 - 38, height / 2 + 50);
                    octx.shadowColor = '#ccff00';
                    octx.shadowBlur = 10;
                    octx.fillStyle = '#ccff00';
                    const barHeights = [14, 25, 12, 28, 18, 22, 10, 20];
                    for (let i = 0; i < 8; i++) {
                        octx.fillRect(i * 10, 30 - barHeights[i], 4, barHeights[i]);
                    }
                    octx.restore();

                    // Draw vibrant neon fluorescent text
                    octx.save();
                    octx.translate(width / 2, height / 2 + 130);
                    octx.shadowColor = '#ccff00';
                    octx.shadowBlur = 15;
                    octx.fillStyle = '#ccff00';
                    octx.font = '600 12px "Inter", system-ui, sans-serif';
                    octx.textAlign = 'center';
                    octx.fillText('PLEASE WAIT, WE ARE LOADING THE UNDERGROUND', 0, 0);
                    octx.restore();

                    // Generate physics-based glass shards (triangles)
                    const centerX = width / 2;
                    const centerY = height / 2;
                    
                    // Ring radii for concentric shattered zones
                    const rings = [0, 40, 100, 220, 450, 750, Math.max(width, height) * 0.9];
                    const sectors = 18;
                    const shards = [];

                    for (let r = 0; r < rings.length - 1; r++) {
                        const rInner = rings[r];
                        const rOuter = rings[r + 1];
                        for (let s = 0; s < sectors; s++) {
                            const a1 = s * (2 * Math.PI / sectors);
                            const a2 = (s + 1) * (2 * Math.PI / sectors);

                            const noiseAngle = () => (Math.random() - 0.5) * 0.08;
                            const noiseRadius = () => (Math.random() - 0.5) * 12;

                            const p1_ang = a1 + noiseAngle();
                            const p1_rad = rInner + (rInner > 0 ? noiseRadius() : 0);
                            const p1 = {
                                x: centerX + p1_rad * Math.cos(p1_ang),
                                y: centerY + p1_rad * Math.sin(p1_ang)
                            };

                            const p2_ang = a2 + noiseAngle();
                            const p2_rad = rInner + (rInner > 0 ? noiseRadius() : 0);
                            const p2 = {
                                x: centerX + p2_rad * Math.cos(p2_ang),
                                y: centerY + p2_rad * Math.sin(p2_ang)
                            };

                            const p3_ang = a1 + noiseAngle();
                            const p3_rad = rOuter + noiseRadius();
                            const p3 = {
                                x: centerX + p3_rad * Math.cos(p3_ang),
                                y: centerY + p3_rad * Math.sin(p3_ang)
                            };

                            const p4_ang = a2 + noiseAngle();
                            const p4_rad = rOuter + noiseRadius();
                            const p4 = {
                                x: centerX + p4_rad * Math.cos(p4_ang),
                                y: centerY + p4_rad * Math.sin(p4_ang)
                            };

                            if (r === 0) {
                                shards.push(createShard({ x: centerX, y: centerY }, p4, p3));
                            } else {
                                shards.push(createShard(p1, p2, p4));
                                shards.push(createShard(p1, p4, p3));
                            }
                        }
                    }

                    function createShard(p1, p2, p3) {
                        const cx = (p1.x + p2.x + p3.x) / 3;
                        const cy = (p1.y + p2.y + p3.y) / 3;

                        const dx = cx - centerX;
                        const dy = cy - centerY;
                        const angle = Math.atan2(dy, dx);
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        const baseSpeed = 1.8 + Math.random() * 3.5;
                        const forceMultiplier = 1.0 + 180 / (dist + 35);
                        const speed = baseSpeed * forceMultiplier;

                        const vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 1.5;
                        const vy = Math.sin(angle) * speed + (Math.random() - 0.5) * 1.5;

                        return {
                            relP1: { x: p1.x - cx, y: p1.y - cy },
                            relP2: { x: p2.x - cx, y: p2.y - cy },
                            relP3: { x: p3.x - cx, y: p3.y - cy },
                            cx,
                            cy,
                            vx,
                            vy,
                            rotation: 0,
                            vRot: (Math.random() - 0.5) * 0.12,
                            gravity: 0.16 + Math.random() * 0.14,
                            friction: 0.985
                        };
                    }

                    // Toggle overlay to canvas shatter view
                    overlay.style.display = 'none';
                    canvas.style.display = 'block';

                    const duration = 1400; // 1.4 seconds physics animation
                    const startTime = performance.now();

                    function animate(now) {
                        const elapsed = now - startTime;
                        const progress = elapsed / duration;

                        if (progress >= 1) {
                            if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
                            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
                            return;
                        }

                        ctx.fillStyle = '#000000';
                        ctx.fillRect(0, 0, width, height);

                        let alpha = 1.0;
                        if (progress > 0.75) {
                            alpha = (1.0 - progress) / 0.25;
                        }

                        ctx.save();
                        ctx.globalAlpha = alpha;

                        shards.forEach(s => {
                            s.vx *= s.friction;
                            s.vy *= s.friction;
                            s.vy += s.gravity;
                            s.cx += s.vx;
                            s.cy += s.vy;
                            s.rotation += s.vRot;

                            const cos = Math.cos(s.rotation);
                            const sin = Math.sin(s.rotation);

                            const getRot = (p) => {
                                return {
                                    x: s.cx + (p.x * cos - p.y * sin),
                                    y: s.cy + (p.x * sin + p.y * cos)
                                };
                            };

                            const r1 = getRot(s.relP1);
                            const r2 = getRot(s.relP2);
                            const r3 = getRot(s.relP3);

                            // Shard clip rendering
                            ctx.save();
                            ctx.beginPath();
                            ctx.moveTo(r1.x, r1.y);
                            ctx.lineTo(r2.x, r2.y);
                            ctx.lineTo(r3.x, r3.y);
                            ctx.closePath();
                            ctx.clip();

                            ctx.drawImage(offscreen, 0, 0, width, height);
                            ctx.restore();

                            // Premium sharp glass highlighted edge stroke
                            ctx.beginPath();
                            ctx.moveTo(r1.x, r1.y);
                            ctx.lineTo(r2.x, r2.y);
                            ctx.lineTo(r3.x, r3.y);
                            ctx.closePath();
                            ctx.strokeStyle = `rgba(204, 255, 0, ${0.45 * alpha})`;
                            ctx.lineWidth = 0.9;
                            ctx.stroke();
                        });

                        ctx.restore();
                        requestAnimationFrame(animate);
                    }

                    requestAnimationFrame(animate);
                }

                // Function to schedule the shatter transition after the minimum display duration
                let loadTriggered = false;
                function triggerShatterWhenReady() {
                    if (loadTriggered) return;
                    loadTriggered = true;
                    
                    const elapsed = Date.now() - preloaderStartTime;
                    const remaining = Math.max(0, MIN_DURATION - elapsed);
                    
                    setTimeout(startShatter, remaining);
                }

                // Bind window load triggers with minimum duration logic and robust safety fallback
                if (document.readyState === 'complete') {
                    triggerShatterWhenReady();
                } else {
                    window.addEventListener('load', triggerShatterWhenReady);
                }
                
                // Maximum safety timeout at 6 seconds
                setTimeout(triggerShatterWhenReady, 6000);
            })();
        </script>
